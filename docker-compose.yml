name: gemastik

# Production stack. Needs a root .env (see .env.example) and web/.env for the AI keys.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gemastik}
      POSTGRES_USER: ${DB_USERNAME:-gemastik}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gemastik} -d ${DB_DATABASE:-gemastik}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gemastik}
      DB_USERNAME: ${DB_USERNAME:-gemastik}
      DB_PASSWORD: ${DB_PASSWORD}
    # Only reached by web over the compose network
    expose:
      - "8000"
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    env_file:
      - web/.env
    environment:
      BACKEND_URL: http://api:8000/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
  api-storage:
